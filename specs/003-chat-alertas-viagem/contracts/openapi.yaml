# Contrato COMPLETO da API v1.2 (desenho): o da 002 (v1.1) mais a rota do chat da 003. Substitui
# specs/002-visto-brasileiros/contracts/openapi.yaml nos testes de contrato e na geração dos tipos do
# frontend; o da 002 fica como histórico da v1.1. O OpenAPI gerado pelo FastAPI em
# /api/v1/openapi.json MUST ser equivalente a este arquivo; um teste de contrato compara os dois, e
# outro garante que a parte da 002 não mudou.
# Mudanças em relação à v1.1: rota nova POST /chat (resposta em fluxo de eventos, text/event-stream)
# e os esquemas dela. Nada foi removido nem renomeado, e as demais rotas continuam só de leitura
# (princípio VIII: a única rota que não é GET é a pergunta do chat).
# O FastAPI descreve o `data` de cada evento só como texto; os esquemas dos eventos ficam em
# `components` (EventoProgresso, EventoResposta, EventoErro) e no `x-eventos` da rota, e a aplicação
# os acrescenta ao OpenAPI gerado.
openapi: 3.1.0
info:
  title: Farol Atlas API
  version: 1.2.0
  description: Dados do mapa de alertas de viagem do Itamaraty para brasileiros, e um chat que responde só com base nesses dados. Serviço não oficial.
servers:
  - url: /api/v1
paths:
  /mapa:
    get:
      operationId: obterMapa
      summary: Tudo o que o mapa precisa, numa chamada só
      description: |
        Níveis já resolvidos por território (inclui a regra de dependências, FR-031).
        Rota de lista: tem teste que limita o número de consultas ao banco.
      responses:
        "200":
          description: Estado atual do mapa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mapa" }
  /paises/{codigo}:
    get:
      operationId: obterPais
      summary: Dados do painel de um país ou dependência
      parameters:
        - name: codigo
          in: path
          required: true
          description: Código do território (ISO-2 ou código de dependência, de 2 a 3 letras como IOA), como em /mapa.
          schema: { type: string, pattern: "^[A-Z]{2,3}$" }
      responses:
        "200":
          description: Painel do território
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pais" }
        "404":
          description: Código desconhecido ou área neutra (FR-016, FR-032)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: Código em formato inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /vistos:
    get:
      operationId: obterVistos
      summary: Situação de visto de cada território, para pintar o globo no modo "Vistos"
      description: |
        Resposta leve (código, situação e indicação de RG por território), mais a fonte e a data da
        última coleta válida de vistos. O frontend a busca sob demanda, ao escolher o modo "Vistos",
        e não no carregamento do site (princípio III). Rota de lista: tem teste que limita o número
        de consultas ao banco. As dependências já vêm resolvidas (a entrada própria ou a do
        soberano, FR-013); Kosovo e Malvinas trazem a situação do soberano (FR-028).
      responses:
        "200":
          description: Situação de visto de todos os territórios com painel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VistosDoMapa" }
  /chat:
    post:
      operationId: perguntarAoChat
      summary: Pergunta ao chat, com resposta em fluxo de eventos
      description: |
        Única rota que não é de leitura (princípio VIII). Nada da pergunta nem da resposta é guardado no
        servidor; o histórico vem do navegador e serve só para entender a pergunta (FR-019, FR-020).

        A resposta é um fluxo `text/event-stream` com, nesta ordem: zero ou mais eventos `progresso`
        e exatamente um `resposta` **ou** um `erro`. Não há envio de texto aos poucos: a resposta só
        vai à pessoa depois de verificada pelo código (trava), então o fluxo mostra o progresso e entrega
        o resultado inteiro. O prazo é de 20 s; passado isso, o evento é `erro` com `tempo_esgotado`.

        Erros que acontecem **antes** do fluxo voltam como JSON comum: `422` (corpo inválido, não conta
        nos limites), `429` (limite por IP ou teto do dia; não chega ao serviço de linguagem) e `503`
        (chat desligado). Falhas por indisponibilidade do serviço de linguagem e estouro de tempo não
        contam nos limites (FR-026b).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PerguntaDoChat" }
      responses:
        "200":
          description: Fluxo de eventos (progresso, depois resposta ou erro)
          content:
            text/event-stream:
              itemSchema:
                type: object
                properties:
                  event: { type: string, enum: [progresso, resposta, erro] }
                  data:
                    type: string
                    contentMediaType: application/json
                    contentSchema:
                      oneOf:
                        - { $ref: "#/components/schemas/EventoProgresso" }
                        - { $ref: "#/components/schemas/EventoResposta" }
                        - { $ref: "#/components/schemas/EventoErro" }
        "422":
          description: Pergunta ou histórico inválidos (vazia, acima de 500 caracteres, histórico acima de 6 itens etc.)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "429":
          description: Limite de 20 perguntas por hora por IP ou teto de 500 perguntas por dia no site
          headers:
            Retry-After:
              description: Segundos até poder perguntar de novo
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErroDoChat" }
        "503":
          description: Chat desligado por configuração (`CHAT_HABILITADO=false`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErroDoChat" }
      x-eventos:
        progresso: { $ref: "#/components/schemas/EventoProgresso" }
        resposta: { $ref: "#/components/schemas/EventoResposta" }
        erro: { $ref: "#/components/schemas/EventoErro" }
  /saude:
    get:
      operationId: obterSaude
      summary: Estado do banco e da coleta
      responses:
        "200":
          description: Saudável
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Saude" }
        "503":
          description: Banco indisponível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Saude" }
components:
  schemas:
    Nivel:
      type: string
      description: Nível exibido de um território (FR-001).
      enum: [sem_alerta, evitar, nao_viajar, nao_verificado]
    NivelRegional:
      type: string
      description: Nível de uma região dentro de um alerta.
      enum: [evitar, nao_viajar]
    TipoTerritorio:
      type: string
      enum: [pais, dependencia]
    TipoPosto:
      type: string
      enum:
        - Embaixada
        - Consulado-Geral
        - Consulado
        - Vice-Consulado
        - Escritório de Representação
        - Escritório Comercial
    Regiao:
      type: object
      required: [nome, nivel]
      properties:
        nome: { type: string, examples: ["Sul do Líbano"] }
        nivel: { $ref: "#/components/schemas/NivelRegional" }
    Mapa:
      type: object
      required: [dados_obtidos, desatualizado, atualizado_em, territorios, postos, paises_sem_posto]
      properties:
        dados_obtidos:
          type: boolean
          description: Falso se nunca houve coleta completa; então todos os níveis são nao_verificado.
        atualizado_em:
          type: [string, "null"]
          format: date-time
          description: Fim da última coleta completa (FR-005).
        desatualizado:
          type: boolean
          description: Verdadeiro se a última coleta completa tem mais de 3 dias (FR-041). Calculado no backend.
        territorios:
          type: array
          description: Países e dependências com nível. Áreas neutras não aparecem aqui.
          items: { $ref: "#/components/schemas/TerritorioNoMapa" }
        postos:
          type: array
          items: { $ref: "#/components/schemas/PostoNoMapa" }
        paises_sem_posto:
          type: array
          description: Ícone próprio e ligação visual ao posto responsável (FR-018).
          items: { $ref: "#/components/schemas/PaisSemPosto" }
    TerritorioNoMapa:
      type: object
      required: [codigo, nome, rotulo_busca, termos_busca, tipo, soberano, bandeira, identidade_do_soberano, nivel, regioes, observacao]
      properties:
        codigo: { type: string }
        nome: { type: string, description: 'Para dependência, "Nome (País)". Para Kosovo e Malvinas, o nome do soberano.' }
        rotulo_busca: { type: string, description: 'Texto da sugestão na busca. Ex.: "Kosovo (Sérvia)".' }
        termos_busca:
          type: array
          description: 'Outros nomes que também encontram o território (ex.: "Kosovo", "Malvinas").'
          items: { type: string }
        tipo: { $ref: "#/components/schemas/TipoTerritorio" }
        soberano: { type: [string, "null"], description: "Código do país soberano; nulo para país." }
        bandeira:
          type: [string, "null"]
          description: Código da bandeira a exibir; nulo para Taiwan. Kosovo e Malvinas usam o do soberano (RS, AR), nunca uma própria.
        identidade_do_soberano:
          type: boolean
          description: Verdadeiro para Kosovo e Malvinas; o painel é o do soberano, com a observação no topo.
        nivel: { $ref: "#/components/schemas/Nivel" }
        regioes:
          type: array
          description: Só regiões com destaque (FR-004). Vazia se não há.
          items: { $ref: "#/components/schemas/Regiao" }
        observacao: { type: [string, "null"] }
    PostoNoMapa:
      type: object
      required: [id, territorio, tipo, cidade, latitude, longitude, grupo]
      properties:
        id: { type: integer }
        territorio: { type: string }
        tipo: { $ref: "#/components/schemas/TipoPosto" }
        cidade: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        grupo:
          type: string
          description: Identifica o ícone compartilhado por postos na mesma coordenada (FR-018d, FR-018g).
    PaisSemPosto:
      type: object
      required: [territorio, latitude, longitude, posto_responsavel_id]
      properties:
        territorio: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        posto_responsavel_id: { type: [integer, "null"], description: Nulo se não há posto indicado (Líbia). }
    Pais:
      type: object
      required:
        [codigo, nome, tipo, soberano, bandeira, identidade_do_soberano, nivel, regioes, observacao,
         observacao_no_topo, eh_brasil, alertas, postos, posto_responsavel, sem_posto_indicado, fonte_postos,
         visto]
      properties:
        codigo: { type: string }
        nome: { type: string }
        tipo: { $ref: "#/components/schemas/TipoTerritorio" }
        soberano: { type: [string, "null"] }
        bandeira:
          type: [string, "null"]
          description: Código da bandeira do painel; nulo para Taiwan. Kosovo e Malvinas mostram a do soberano.
        identidade_do_soberano: { type: boolean }
        nivel: { $ref: "#/components/schemas/Nivel" }
        regioes:
          type: array
          items: { $ref: "#/components/schemas/Regiao" }
        regiao_unica_do_alerta:
          type: boolean
          description: Verdadeiro se o alerta que rege o território só tem nível regional (FR-007).
        observacao: { type: [string, "null"] }
        observacao_no_topo:
          type: boolean
          description: Kosovo e Malvinas abrem o painel do soberano com a observação no topo (FR-030, FR-034).
        eh_brasil:
          type: boolean
          description: O painel do Brasil é próprio e não lista postos (FR-015).
        alertas:
          type: array
          description: Todos os alertas de viagem que citam o território (e o soberano, se dependência), do mais recente ao mais antigo (FR-010).
          items: { $ref: "#/components/schemas/AlertaDoPais" }
        postos:
          type: array
          items: { $ref: "#/components/schemas/PostoNoPainel" }
        posto_responsavel:
          anyOf:
            - { $ref: "#/components/schemas/PostoNoPainel" }
            - { type: "null" }
          description: Posto, em outro país, que atende quem está lá (FR-013).
        sem_posto_indicado:
          type: boolean
          description: Verdadeiro se não há posto nem posto responsável (FR-014).
        fonte_postos:
          description: Fonte e data dos dados de postos, para a linha abaixo da lista (FR-011a). Nulo quando o painel não lista nenhum posto (Brasil e Líbia).
          anyOf:
            - { $ref: "#/components/schemas/FontePostos" }
            - { type: "null" }
        visto:
          description: |
            Seção "Visto" do painel (feature 002). Nulo **somente** para o Brasil (FR-014). Todo outro
            território com painel traz o objeto; sem dado de visto, `situacao` é `sem_informacao`.
          anyOf:
            - { $ref: "#/components/schemas/Visto" }
            - { type: "null" }
    AlertaDoPais:
      type: object
      required: [titulo, url, publicado_em, modificado_em, define_nivel, situacao_normalizada]
      properties:
        titulo: { type: string }
        url: { type: string, format: uri }
        publicado_em: { type: string, format: date-time }
        modificado_em: { type: [string, "null"], format: date-time }
        define_nivel: { type: boolean, description: Verdadeiro para o alerta mais recente, que rege o nível. }
        situacao_normalizada: { type: boolean }
        pendente: { type: boolean, description: Ainda sem classificação válida (FR-008). }
    PostoNoPainel:
      type: object
      required: [id, tipo, cidade, pais, grupo, endereco, telefone_plantao, contato_coletado_em, contato_fonte_url]
      properties:
        id: { type: integer }
        tipo: { $ref: "#/components/schemas/TipoPosto" }
        cidade: { type: string }
        pais: { type: string, description: Nome do país do posto (útil para o posto responsável). }
        grupo: { type: string }
        endereco: { type: [string, "null"] }
        telefone_plantao: { type: [string, "null"] }
        contato_coletado_em: { type: [string, "null"], format: date-time }
        contato_fonte_url: { type: [string, "null"], format: uri }
    FontePostos:
      type: object
      required: [conferido_em, fontes]
      properties:
        conferido_em: { type: string, format: date }
        fontes:
          type: array
          items: { $ref: "#/components/schemas/Fonte" }
    Fonte:
      type: object
      required: [nome, url]
      properties:
        nome: { type: string, examples: ["Itamaraty", "Wikipédia"] }
        url: { type: string, format: uri }
        licenca: { type: [string, "null"], examples: ["CC BY-SA"] }
    SituacaoDeVisto:
      type: string
      description: Situação de visto de um território com painel (FR-002, FR-011).
      enum: [isento, visto_na_chegada, autorizacao_eletronica, visto_exigido, outra_situacao, sem_informacao]
    SituacaoNoGlobo:
      type: string
      description: A situação do globo é a do painel mais `nao_se_aplica`, só para o Brasil (FR-023).
      enum: [isento, visto_na_chegada, autorizacao_eletronica, visto_exigido, outra_situacao, sem_informacao, nao_se_aplica]
    MotivoOutraSituacao:
      type: string
      description: Por que o território está em "Outra situação".
      enum: [rotulo_conhecido, rotulo_desconhecido]
    OrigemDoVisto:
      type: string
      description: A entrada é a do próprio território ou a do soberano (FR-013).
      enum: [proprio, soberano]
    TipoDePermanencia:
      type: string
      description: |
        `padronizada`: texto em português de um formato conhecido (FR-004a). `original`: como a fonte
        escreveu, em inglês, sem tradução. `prazos_divergentes`: linhas da fonte com prazos diferentes.
        `varia_conforme_motivo`: o prazo muda conforme o motivo da viagem (FR-007a).
      enum: [padronizada, original, prazos_divergentes, varia_conforme_motivo]
    Permanencia:
      type: object
      required: [tipo, texto]
      properties:
        tipo: { $ref: "#/components/schemas/TipoDePermanencia" }
        texto:
          type: [string, "null"]
          description: Preenchido só para `padronizada` (português) e `original` (inglês). O texto dos outros tipos é fixo e fica no frontend.
    ObservacaoDeVisto:
      type: object
      required: [texto_original, traducao]
      properties:
        texto_original: { type: string, description: "Texto da fonte, em inglês. Texto puro; nunca HTML." }
        traducao:
          type: [string, "null"]
          description: Tradução automática para o português; nulo se ainda não foi traduzida (o painel mostra o original, avisando).
    Visto:
      type: object
      required:
        [situacao, motivo_outra_situacao, rotulo_original, aceita_rg, varia_conforme_motivo, permanencia,
         observacoes, origem, soberano_nome, territorio_nome, dado_de, desatualizado, fonte]
      properties:
        situacao: { $ref: "#/components/schemas/SituacaoDeVisto" }
        motivo_outra_situacao:
          description: Preenchido só quando `situacao` é `outra_situacao`.
          anyOf:
            - { $ref: "#/components/schemas/MotivoOutraSituacao" }
            - { type: "null" }
        rotulo_original:
          type: [string, "null"]
          description: Rótulo da fonte, normalizado; sempre presente com dado, e visível em "Outra situação" e nos rótulos combinados (FR-003, FR-007). Nulo em `sem_informacao`.
        aceita_rg: { type: boolean, description: "Basta o documento de identidade (RG), FR-006." }
        varia_conforme_motivo: { type: boolean, description: "A regra varia conforme o motivo da viagem (FR-007a)." }
        permanencia:
          description: Nulo quando a fonte não informa permanência (FR-004) e em `sem_informacao`.
          anyOf:
            - { $ref: "#/components/schemas/Permanencia" }
            - { type: "null" }
        observacoes:
          type: array
          items: { $ref: "#/components/schemas/ObservacaoDeVisto" }
        origem:
          description: Nulo em `sem_informacao`.
          anyOf:
            - { $ref: "#/components/schemas/OrigemDoVisto" }
            - { type: "null" }
        soberano_nome:
          type: [string, "null"]
          description: Nome do soberano, para a nota "vale a entrada de …"; preenchido só quando `origem` é `soberano`.
        territorio_nome:
          type: [string, "null"]
          description: |
            Nome do território a que o visto se refere quando o painel tem a identidade de outro país
            (Kosovo e Ilhas Malvinas, convenção da 001); nulo nos demais. A seção se intitula
            "Visto: <nome>". A identidade do painel (nome, bandeira, nota) é a do soberano, mas a
            regra de entrada é a da linha própria da fonte.
        dado_de:
          type: [string, "null"]
          format: date-time
          description: Data do dado mostrado para este território (FR-008), e não a da última coleta do conjunto. Nulo em `sem_informacao`.
        desatualizado: { type: boolean, description: "`dado_de` tem mais de 14 dias (FR-015). Calculado no backend." }
        fonte:
          $ref: "#/components/schemas/Fonte"
    TerritorioDeVisto:
      type: object
      required: [codigo, situacao, aceita_rg]
      properties:
        codigo: { type: string, description: Mesmo código de /mapa. }
        situacao: { $ref: "#/components/schemas/SituacaoNoGlobo" }
        aceita_rg: { type: boolean }
    VistosDoMapa:
      type: object
      required: [dados_obtidos, coletado_em, desatualizado, fonte, territorios]
      properties:
        dados_obtidos:
          type: boolean
          description: Falso se nunca houve coleta válida de vistos; então todo território é `sem_informacao` (e o Brasil, `nao_se_aplica`).
        coletado_em:
          type: [string, "null"]
          format: date-time
          description: Fim da última coleta válida de vistos (para a linha de fonte e data do mapa, FR-029).
        desatualizado:
          type: boolean
          description: A última coleta válida tem mais de 14 dias (FR-029a). Calculado no backend.
        fonte: { $ref: "#/components/schemas/Fonte" }
        territorios:
          type: array
          description: Os mesmos territórios de /mapa (países e dependências), com a situação já resolvida.
          items: { $ref: "#/components/schemas/TerritorioDeVisto" }
    Saude:
      type: object
      required: [banco, ultima_coleta_completa_em, ultima_tentativa_em, alertas_pendentes]
      properties:
        banco: { type: string, enum: [ok, falha] }
        ultima_coleta_completa_em: { type: [string, "null"], format: date-time }
        ultima_tentativa_em: { type: [string, "null"], format: date-time }
        alertas_pendentes: { type: integer }
    Erro:
      type: object
      required: [detalhe]
      properties:
        detalhe: { type: string }
    PerguntaDoChat:
      type: object
      required: [pergunta, historico]
      additionalProperties: false
      properties:
        pergunta: { type: string, minLength: 1, maxLength: 500, description: A pergunta, depois de remover espaços das pontas (FR-024). }
        historico:
          type: array
          maxItems: 6
          description: |
            As últimas mensagens da conversa, mantidas só no navegador (FR-019, FR-020). Servem para
            entender de que país se fala; **nunca são fonte de fatos** e são tratadas como não confiáveis.
          items: { $ref: "#/components/schemas/MensagemDoHistorico" }
    MensagemDoHistorico:
      type: object
      required: [papel, texto]
      additionalProperties: false
      properties:
        papel: { type: string, enum: [pessoa, assistente] }
        texto: { type: string, minLength: 1, maxLength: 1500 }
    ErroDoChat:
      type: object
      required: [detalhe, codigo]
      properties:
        detalhe: { type: string, description: Mensagem para a pessoa, em português. }
        codigo: { type: string, enum: [limite_por_hora, limite_do_dia, chat_desligado] }
        espera_segundos: { type: [integer, "null"], description: Segundos até poder perguntar de novo (limite por hora). }
        volta_em: { type: [string, "null"], format: date-time, description: Quando o chat volta (teto do dia, à meia-noite de Brasília). }
    EventoProgresso:
      type: object
      required: [etapa, mensagem]
      properties:
        etapa:
          type: string
          enum: [identificando_pais, buscando_nos_alertas, consultando_nivel, consultando_visto, consultando_postos, montando_resposta]
        mensagem: { type: string, examples: ["Buscando nos alertas…"] }
    SituacaoDaResposta:
      type: string
      description: |
        resposta: respondeu com base nos dados. nao_encontrei: a informação não está nos dados.
        recusa: fora do escopo ou pedido de recomendação própria. pergunta_de_volta: faltou ou sobrou país.
        so_registros: contingência, só com os cartões do painel (sem texto do modelo).
      enum: [resposta, nao_encontrei, recusa, pergunta_de_volta, so_registros]
    EventoResposta:
      type: object
      required: [situacao, texto, cartoes, citacoes, avisos]
      properties:
        situacao: { $ref: "#/components/schemas/SituacaoDaResposta" }
        texto: { type: string, description: "Prosa em português, só texto (nunca HTML nem links). Os valores de nível, visto e posto estão nos cartões." }
        cartoes:
          type: array
          items: { $ref: "#/components/schemas/CartaoDoChat" }
        citacoes:
          type: array
          items: { $ref: "#/components/schemas/CitacaoDoChat" }
        avisos:
          type: array
          description: "Avisos do próprio sistema (ex.: dado de visto possivelmente desatualizado; alerta usado é anterior)."
          items: { type: string }
    EventoErro:
      type: object
      required: [codigo, mensagem, pode_tentar_de_novo]
      properties:
        codigo: { type: string, enum: [servico_indisponivel, tempo_esgotado, erro_interno] }
        mensagem: { type: string }
        pode_tentar_de_novo: { type: boolean }
    CartaoDoChat:
      oneOf:
        - { $ref: "#/components/schemas/CartaoDeNivel" }
        - { $ref: "#/components/schemas/CartaoDeVisto" }
        - { $ref: "#/components/schemas/CartaoDePostos" }
        - { $ref: "#/components/schemas/CartaoDeLista" }
      discriminator:
        propertyName: tipo
        mapping:
          nivel: "#/components/schemas/CartaoDeNivel"
          visto: "#/components/schemas/CartaoDeVisto"
          postos: "#/components/schemas/CartaoDePostos"
          lista: "#/components/schemas/CartaoDeLista"
    CartaoDeNivel:
      type: object
      description: "O nível do painel, com os mesmos dados do `Pais` de GET /paises/{codigo}."
      required: [tipo, pais_codigo, pais_nome, nivel, regioes, regiao_unica_do_alerta, observacao, alerta_que_rege, atualizado_em]
      properties:
        tipo: { type: string, const: nivel }
        pais_codigo: { type: string, pattern: "^[A-Z]{2,3}$" }
        pais_nome: { type: string }
        nivel: { $ref: "#/components/schemas/Nivel" }
        regioes:
          type: array
          items: { $ref: "#/components/schemas/Regiao" }
        regiao_unica_do_alerta: { type: boolean }
        observacao: { type: [string, "null"] }
        alerta_que_rege:
          oneOf:
            - { $ref: "#/components/schemas/AlertaDoPais" }
            - { type: "null" }
        atualizado_em: { type: [string, "null"], format: date-time, description: Fim da última coleta completa. }
    CartaoDeVisto:
      type: object
      description: 'A seção "Visto" do painel, com os mesmos dados do campo `visto` de `Pais`. Nunca existe para o Brasil.'
      required: [tipo, pais_codigo, pais_nome, visto]
      properties:
        tipo: { type: string, const: visto }
        pais_codigo: { type: string, pattern: "^[A-Z]{2,3}$" }
        pais_nome: { type: string }
        visto: { $ref: "#/components/schemas/Visto" }
    CartaoDePostos:
      type: object
      description: Postos, posto responsável e fonte, com os mesmos dados de `Pais`.
      required: [tipo, pais_codigo, pais_nome, postos, posto_responsavel, sem_posto_indicado, fonte_postos]
      properties:
        tipo: { type: string, const: postos }
        pais_codigo: { type: string, pattern: "^[A-Z]{2,3}$" }
        pais_nome: { type: string }
        postos:
          type: array
          items: { $ref: "#/components/schemas/PostoNoPainel" }
        posto_responsavel:
          oneOf:
            - { $ref: "#/components/schemas/PostoNoPainel" }
            - { type: "null" }
        sem_posto_indicado: { type: boolean }
        fonte_postos:
          oneOf:
            - { $ref: "#/components/schemas/FontePostos" }
            - { type: "null" }
    PaisDaLista:
      type: object
      required: [codigo, nome]
      properties:
        codigo: { type: string, pattern: "^[A-Z]{2,3}$" }
        nome: { type: string }
    CartaoDeLista:
      type: object
      description: |
        Resposta a uma pergunta sem país específico ("quais países têm alerta de não viajar?",
        "para onde posso ir só com o RG?"). Os países são exatamente os que o filtro da legenda do
        mapa mostra para o mesmo nível ou categoria (FR-013a); só países, em ordem alfabética, até 50
        nomes (FR-013b). Montado pelo código a partir de GET /mapa e GET /vistos.
      required: [tipo, assunto, criterio, paises, total, exibidos, truncada, fonte, atualizado_em, desatualizado]
      properties:
        tipo: { type: string, const: lista }
        assunto: { type: string, enum: [nivel, visto] }
        criterio: { type: string, examples: ["Não viaje", "Isento, entrada com RG"], description: O critério em texto legível, como a legenda do mapa. }
        paises:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/PaisDaLista" }
        total: { type: integer, minimum: 0, description: Quantos países satisfazem o critério. }
        exibidos: { type: integer, minimum: 0, maximum: 50 }
        truncada: { type: boolean, description: Verdadeiro quando `total` passa de `exibidos` (o resto se vê na legenda do mapa). }
        fonte: { $ref: "#/components/schemas/Fonte" }
        atualizado_em: { type: [string, "null"], format: date-time, description: "Nível: fim da última coleta completa. Visto: fim da última coleta válida." }
        desatualizado: { type: boolean }
    CitacaoDoChat:
      type: object
      description: Referência a um dado usado na resposta. Montada pelo código a partir dos dados, nunca escrita pelo modelo (FR-002).
      required: [tipo, titulo, data, url, vigor, trecho, licenca]
      properties:
        tipo: { type: string, enum: [alerta, nivel, visto, postos] }
        titulo: { type: string }
        data:
          type: [string, "null"]
          format: date-time
          description: "Alerta: última modificação ou, na falta, publicação. Registro: a data do dado, como o painel mostra."
        url: { type: [string, "null"], format: uri }
        vigor:
          type: string
          description: "Só para alertas. `anterior` = não é o alerta que rege o nível atual do país (FR-006)."
          enum: [em_vigor, anterior, nao_se_aplica]
        trecho:
          type: [string, "null"]
          description: 'Texto original do alerta, exatamente como está nos dados e só o trecho usado (bloco "Ver trecho"). Nulo nas citações de registros.'
        licenca: { type: [string, "null"], examples: ["CC BY-SA"] }
