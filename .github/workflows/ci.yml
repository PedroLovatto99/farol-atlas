name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # Os testes de integração leem esta variável (ver backend/tests/conftest.py).
      # Credencial descartável do banco de teste que só existe dentro deste job; não é segredo.
      DATABASE_URL_TESTE: postgresql+psycopg://farol:farol@127.0.0.1:5432/farol_teste
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: farol
          POSTGRES_PASSWORD: farol
          POSTGRES_DB: farol_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farol -d farol_teste"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Estilo (ruff check)
        run: uv run poe lint

      - name: Estilo (ruff format)
        run: uv run poe formato

      - name: Tipos (mypy)
        run: uv run poe tipos

      - name: Fronteiras entre módulos (import-linter)
        run: uv run poe arquitetura

      - name: Testes de unidade
        run: uv run pytest tests/unidade tests/contrato

      - name: Testes de integração
        run: uv run pytest tests/integracao

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Formato (prettier)
        run: npm run formato

      - name: Tipos (tsc)
        run: npm run tipos

      - name: Testes (vitest)
        run: npm run testes

      - name: Build
        run: npm run build
