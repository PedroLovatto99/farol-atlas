[project]
name = "farol"
version = "0.1.0"
description = "Farol Atlas: mapa de alertas de viagem do Itamaraty para brasileiros (serviço não oficial)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "apscheduler",
    "requests",
    "beautifulsoup4",
    "protego",
    "pyyaml",
    "langchain",
    "langchain-google-genai",
    "langchain-ollama",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "python-dotenv",
    "ruff",
    "mypy",
    "import-linter",
    "pip-audit",
    "poethepoet",
    "types-requests",
    "types-pyyaml",
    "shapely>=2.2.0",
]
geo = [
    "shapely",
    "pycountry",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farol"]

[tool.uv]
default-groups = ["dev", "geo"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # acentos e aspas tipográficas em português

[tool.ruff.lint.isort]
known-first-party = ["farol"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["src"]
files = ["src", "tests", "scripts"]
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "protego.*", "shapely.*", "pycountry.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
filterwarnings = ["error::DeprecationWarning:farol.*"]

# --------------------------------------------------------------------------- import-linter
# Camadas (de cima para baixo): api | worker  >  mapa | coleta | classificacao  >  dominio  >  infra.
# Um módulo só importa a interface pública (o __init__) dos módulos das camadas abaixo.
[tool.importlinter]
root_package = "farol"

[[tool.importlinter.contracts]]
name = "Camadas do backend"
type = "layers"
layers = [
    "farol.api | farol.worker",
    "farol.mapa | farol.coleta | farol.classificacao",
    "farol.dominio",
    "farol.infra",
]

[[tool.importlinter.contracts]]
name = "Casos de uso independentes entre si"
type = "independence"
modules = ["farol.mapa", "farol.coleta", "farol.classificacao"]

[[tool.importlinter.contracts]]
name = "So a interface publica de dominio"
type = "forbidden"
source_modules = [
    "farol.api",
    "farol.worker",
    "farol.mapa",
    "farol.coleta",
    "farol.classificacao",
    "farol.infra",
]
forbidden_modules = ["farol.dominio.*"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "So a interface publica de infra"
type = "forbidden"
source_modules = [
    "farol.api",
    "farol.worker",
    "farol.mapa",
    "farol.coleta",
    "farol.classificacao",
    "farol.dominio",
]
forbidden_modules = ["farol.infra.*"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "So a interface publica de coleta"
type = "forbidden"
source_modules = [
    "farol.api",
    "farol.worker",
    "farol.mapa",
    "farol.classificacao",
    "farol.dominio",
    "farol.infra",
]
forbidden_modules = ["farol.coleta.*"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "So a interface publica de classificacao"
type = "forbidden"
source_modules = [
    "farol.api",
    "farol.worker",
    "farol.mapa",
    "farol.coleta",
    "farol.dominio",
    "farol.infra",
]
forbidden_modules = ["farol.classificacao.*"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "So a interface publica de mapa"
type = "forbidden"
source_modules = [
    "farol.api",
    "farol.worker",
    "farol.coleta",
    "farol.classificacao",
    "farol.dominio",
    "farol.infra",
]
forbidden_modules = ["farol.mapa.*"]
allow_indirect_imports = true

# --------------------------------------------------------------------------- tarefas (poe)
[tool.poe.tasks]
lint = "ruff check ."
formato = "ruff format --check ."
tipos = "mypy"
arquitetura = "lint-imports"
testes = "pytest"
auditoria = "pip-audit"
exportar-openapi = "python -m farol.api.exportar_openapi"

[tool.poe.tasks.verificar]
help = "Roda lint, formato, tipos, arquitetura, testes e auditoria de dependências"
sequence = ["lint", "formato", "tipos", "arquitetura", "testes", "auditoria"]
